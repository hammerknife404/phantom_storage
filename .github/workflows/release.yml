name: Release

# Publishes mod_version from gradle.properties as a GitHub release, tagged v<mod_version>, with the
# jar attached. It runs:
# - on every push to main: merging a PR that bumps mod_version releases it; any other push finds
#   that version already released and stops there;
# - by hand ("Run workflow" on main in the Actions tab), e.g. to retry a failed release;
# - when a v<mod_version> tag is pushed.
# It never replaces a release. .github/release-notes.md, if there is one, goes above the notes
# GitHub writes from the merged PRs.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      mod_id: ${{ steps.check.outputs.mod_id }}
      mod_name: ${{ steps.check.outputs.mod_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this version released yet?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          version=$(prop mod_version)
          tag="v$version"
          {
            echo "version=$version"
            echo "mod_id=$(prop mod_id)"
            echo "mod_name=$(prop mod_name)"
          } >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"
              exit 1
            fi
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are built from main or a v* tag, not $GITHUB_REF"
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::$tag is already released. Bump mod_version in gradle.properties first."
              exit 1
            fi
            echo "$tag is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A tag left without a release must point at this commit, or the jar wouldn't match it.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | tail -n 1 | cut -f1)
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists on ${tagged::7}, not this commit. Delete the tag or bump mod_version."
              exit 1
            fi
          fi

          echo "Releasing $tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace
        env:
          RELEASE: 'true'

      - name: Show built jar
        run: ls -l build/libs

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          MOD_ID: ${{ needs.check.outputs.mod_id }}
          MOD_NAME: ${{ needs.check.outputs.mod_name }}
        run: |
          notes=()
          if [ -f .github/release-notes.md ]; then
            notes=(--notes-file .github/release-notes.md)
          fi
          # Creates the tag on the commit that was built.
          gh release create "v$VERSION" "build/libs/$MOD_ID-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "$MOD_NAME $VERSION" --generate-notes "${notes[@]}"
