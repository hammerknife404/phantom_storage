name: Release

# Publishes a GitHub release for the version in gradle.properties (tag v<mod_version>).
# Trigger by pushing a matching tag, or run manually from the Actions tab on main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read mod version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are built from main or a v* tag, not $GITHUB_REF"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.version }} already exists. Bump mod_version (or delete that release) first."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --stacktrace
        env:
          RELEASE: 'true'

      - name: Show built jar
        run: ls -l build/libs

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Phantom Storage ${{ steps.version.outputs.version }}
          files: build/libs/phantomstorage-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true
          body: |
            **Requires:** Minecraft 1.21.1, NeoForge 21.1.251+. **Optional:** JEI or REI (recipe lookup and crafting-grid fill).

            | Action | Result |
            |---|---|
            | Shift + scroll with the Phantom Charm | Switch mode: Chest or Tank |
            | Right-click Phantom Charm | Summon that pet, or recall it to your side if it's out (5 s cooldown) |
            | Shift + right-click Phantom Charm | Dismiss that pet (same cooldown) |
            | Right-click a pet | Open its storage (tank: a bucket or bottle pours in / fills from the active tank) |
            | Sneak + right-click a pet | Toggle stay / follow (tank, holding a bucket: cycle the active tank) |
            | Look at a pet ~½ s (idle) | It comes within reach |

            | In the chest | |
            |---|---|
            | Sort icon: click / right-click or scroll / shift + click | Sort / change mode (Name, Amount, Mod) / reverse order |

            | In the tank | |
            |---|---|
            | Click a gauge (empty cursor) / with a container | Make it the active tank / pour in (left) or fill (right) |
            | Overfill / Drain all checkboxes | Let bucket use on the tank spill into or draw from the next tank (off by default) |

            **Recipe:** Phantom Membrane ×3 around an Ender Chest, Soul Campfire below, Gold Block in each corner.
            **Unlocks:** the Phantom Tank needs the advancement *Not Quite "Nine" Lives* (charge a respawn anchor).
            **Phantoms keep their distance** while you carry the charm or have a pet within 16 blocks of them.
            **Client config** (Mods → Phantom Storage → Config): opacity for all pets or each one, and glow on/off per pet.
          generate_release_notes: true
